name: evening

on:
  # 云端定时（UTC）。北京 19:10 启动一条 job，evening.py 内部依次等到
  # 19:10 发晚餐、20:30 发明天午餐。只配一条 schedule，避免两个 job 重复发送。
  schedule:
    - cron: '10 11 * * *'   # 北京 19:10
  workflow_dispatch:

concurrency:
  group: evening
  cancel-in-progress: true

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TZ: Asia/Shanghai
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 睡到 19:10 / 20:30 准点发送
        run: python3 evening.py
