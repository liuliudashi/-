name: evening

on:
  # 主路径：云端定时，不依赖本机开机。
  # 用 :05 而不是 :10，给 runner 启动留 5 分钟余量，evening.py 会自己 sleep 到 19:10。
  # 注意 GitHub 免费队列偶尔延迟（11-23 实测延迟 11h25m），所以下面还保留
  # push 触发作为兜底：本机 17:50 开着就推一下，谁先到谁生效（concurrency 去重）。
  schedule:
    - cron: '5 11 * * *'    # 北京 19:05 启动
  push:
    branches: [main]
    paths:
      - 'evening-trigger.txt'
  workflow_dispatch:

concurrency:
  group: evening
  cancel-in-progress: true

jobs:
  send:
    runs-on: ubuntu-latest
    # 17:50 触发到 20:30 结束约 160 分钟；留足余量（GitHub 单 job 上限 6 小时）。
    timeout-minutes: 340
    env:
      TZ: Asia/Shanghai
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 睡到 19:10 / 20:30 准点发送
        run: python3 evening.py
