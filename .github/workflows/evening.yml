name: evening

on:
  # 不用 schedule：实测 GitHub 免费队列把 11:10 UTC 的计划延迟到 22:35 UTC
  # （北京次日 06:35）才启动，job 撑不到 19:10 就被 timeout 杀掉。
  # 改回「本机 17:50 推 evening-trigger.txt 触发」→ 云端 sleep 到 19:10 / 20:30 准点发。
  # 只依赖 17:50 那一刻电脑开着，白天关机时段不受影响。
  push:
    branches: [main]
    paths:
      - 'evening-trigger.txt'
  workflow_dispatch:

concurrency:
  group: evening
  cancel-in-progress: true

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      TZ: Asia/Shanghai
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 睡到 19:10 / 20:30 准点发送
        run: python3 evening.py
