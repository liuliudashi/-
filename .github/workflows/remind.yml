name: health-reminder

on:
  # 云端 schedule 延迟不可控（实测 11 小时+），周日采购清单改由本机
  # crontab（0 15 * * 0）直接发；这里只保留手动触发。
  workflow_dispatch:
    inputs:
      mode:
        description: 'lunch / dinner / shop'
        required: true
        default: 'dinner'

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 发送提醒
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          [ -z "$MODE" ] && MODE=dinner
          echo "mode=$MODE"
          python3 remind.py "$MODE"
