name: health-reminder

on:
  # 周日采购清单：云端定时（不依赖本机开机）+ 本机 crontab 兜底。
  schedule:
    - cron: '0 7 * * 0'     # 北京 周日 15:00  推「本周采购清单」
  workflow_dispatch:
    inputs:
      mode:
        description: 'lunch / dinner / shop'
        required: true
        default: 'dinner'

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 发送提醒
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          case "${{ github.event.schedule }}" in
            "0 7 * * 0") MODE=shop ;;
            *)           MODE="${{ github.event.inputs.mode }}" ;;
          esac
          [ -z "$MODE" ] && MODE=dinner
          date '+运行开始（北京）: %F %T %A'
          echo "mode=$MODE"
          python3 remind.py "$MODE"
