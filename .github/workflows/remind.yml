name: health-reminder

on:
  # 云端 schedule 延迟严重（实测约 5 小时），已改用本机 cron 准点触发。
  # 如需恢复云端定时，取消下面注释即可。
  # schedule:
  #   - cron: '30 12 * * *'   # 北京 20:30  推「明天午餐」
  #   - cron: '10 11 * * *'   # 北京 19:10  推「今晚晚餐」
  #   - cron: '0 7 * * 0'     # 北京 周日 15:00  推「本周采购清单」
  workflow_dispatch:
    inputs:
      mode:
        description: 'lunch / dinner / shop'
        required: true
        default: 'dinner'

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 发送提醒
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          case "${{ github.event.schedule }}" in
            "30 12 * * *") MODE=lunch ;;
            "10 11 * * *") MODE=dinner ;;
            "0 7 * * 0")   MODE=shop ;;
            *)             MODE="${{ github.event.inputs.mode }}" ;;
          esac
          [ -z "$MODE" ] && MODE=dinner
          echo "mode=$MODE"
          python3 remind.py "$MODE"
