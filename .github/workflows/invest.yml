name: invest

on:
  # 持仓日报放云端，不依赖本机开机（工作日北京 14:50 = UTC 06:50）。
  # 暴跌提醒时效性要求高、且 GitHub schedule 延迟不可控，仍由本机 invest-bot
  # 的 crontab（*/5 9-15 工作日）负责，这里不再重复配置。
  schedule:
    - cron: '50 6 * * 1-5'      # 北京 14:50  持仓日报（工作日）
  workflow_dispatch:
    inputs:
      mode:
        description: 'report / alert'
        required: true
        default: 'report'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      FEISHU_WEBHOOK_INVEST: ${{ secrets.FEISHU_WEBHOOK_INVEST }}
      INVEST_CONFIG: ${{ secrets.INVEST_CONFIG }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 恢复暴跌提醒状态
        uses: actions/cache@v4
        with:
          path: invest/logs/alert_state.json
          key: invest-alert-state-${{ github.run_id }}
          restore-keys: invest-alert-state-

      - name: 运行
        run: |
          case "${{ github.event.schedule }}" in
            "50 6 * * 1-5")     MODE=report ;;
            "*/30 1-7 * * 1-5") MODE=alert ;;
            *)                  MODE="${{ github.event.inputs.mode }}" ;;
          esac
          [ -z "$MODE" ] && MODE=report
          echo "mode=$MODE"
          mkdir -p invest/logs
          [ -f invest/logs/alert_state.json ] || echo '{}' > invest/logs/alert_state.json
          cd invest
          if [ "$MODE" = "report" ]; then
            python3 report.py --no-ai
          else
            python3 alert.py --no-ai
          fi
