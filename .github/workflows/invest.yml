name: invest

on:
  # 不用 schedule：实测延迟 11 小时以上（06:50 UTC 的 job 凌晨 02:46 才跑，且失败）。
  # 持仓日报仍由本机 invest-bot 的 crontab（50 14 * * 1-5）负责。
  # 云端只保留手动触发，用于本机长期离线时临时补发。
  workflow_dispatch:
    inputs:
      mode:
        description: 'report / alert'
        required: true
        default: 'report'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      FEISHU_WEBHOOK_INVEST: ${{ secrets.FEISHU_WEBHOOK_INVEST }}
      INVEST_CONFIG: ${{ secrets.INVEST_CONFIG }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 恢复暴跌提醒状态
        uses: actions/cache@v4
        with:
          path: invest/logs/alert_state.json
          key: invest-alert-state-${{ github.run_id }}
          restore-keys: invest-alert-state-

      - name: 运行
        run: |
          case "${{ github.event.schedule }}" in
            "50 6 * * 1-5")     MODE=report ;;
            "*/30 1-7 * * 1-5") MODE=alert ;;
            *)                  MODE="${{ github.event.inputs.mode }}" ;;
          esac
          [ -z "$MODE" ] && MODE=report
          echo "mode=$MODE"
          mkdir -p invest/logs
          [ -f invest/logs/alert_state.json ] || echo '{}' > invest/logs/alert_state.json
          cd invest
          if [ "$MODE" = "report" ]; then
            python3 report.py --no-ai
          else
            python3 alert.py --no-ai
          fi
